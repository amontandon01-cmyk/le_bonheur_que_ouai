<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Contrôle temporaire de mise en page</title><style>body{margin:0;background:#ddd;font:14px sans-serif}header{display:flex;gap:20px;align-items:center;padding:12px;background:#fff}select{padding:8px}#surface{margin:12px auto;overflow:hidden}iframe{border:0;display:block;transform-origin:top left;background:#fff}</style><header><label>Largeur <select id="width"><option>1920</option><option>1440</option><option selected>1280</option><option>1024</option><option>980</option><option>768</option><option>390</option><option>320</option></select></label><label>Page <select id="page"><option value="index.html">Accueil</option><option value="melanie-vonlanthen.html">Mélanie</option><option value="methode-fides.html">FIDES</option><option value="contact.html">Contact</option></select></label></header><div id="surface"><iframe id="site" title="Site testé" src="../index.html"></iframe></div><script>const size=document.querySelector('#width'),page=document.querySelector('#page'),frame=document.querySelector('#site'),surface=document.querySelector('#surface');function resize(){const w=Number(size.value),scale=Math.min(1,(innerWidth-24)/w);frame.style.width=w+'px';frame.style.height='1000px';frame.style.transform='scale('+scale+')';surface.style.width=w*scale+'px';surface.style.height=1000*scale+'px'}size.addEventListener('change',resize);page.addEventListener('change',()=>{frame.src='../'+page.value});window.addEventListener('resize',resize);resize();</script></html>
